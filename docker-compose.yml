services:
  jarvis:
    build: .
    container_name: jarvis-orchestrator
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - jarvis_data:/app/data
    ports:
      - "3001:3001"
    environment:
      - DATA_PATH=/app/data/jarvis_store.json
      - PORT=3001

volumes:
  jarvis_data:
    driver: local
