services:
  jarvis:
    build: .
    container_name: jarvis-orchestrator
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - jarvis_data:/app/data
    ports:
      - "3001:3001"
    environment:
      - DATA_PATH=/app/data/jarvis.db
      - PORT=3001
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  jarvis_data:
    driver: local
